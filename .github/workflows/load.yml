name: Load smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  k6:
    name: k6 smoke (5 virtual users, about 70 seconds)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: grafana/setup-k6-action@v1
      - run: k6 run load/smoke.js
